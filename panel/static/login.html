<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlyGo - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* warm stone + orange (DESIGN.md 2026-09-07); dark explicit */
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:rgba(30,41,59,.85);backdrop-filter:blur(12px);border:1px solid rgba(100,116,139,.3);border-radius:16px;padding:40px 32px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{font-size:1.5rem;font-weight:600;margin-bottom:8px;color:#f8fafc}
.sub{font-size:.85rem;color:#94a3b8;margin-bottom:28px}
.logo{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.logo svg{width:60%;height:60%;display:block}
input[type=password]{width:100%;padding:12px 16px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#f8fafc;font-size:1rem;outline:none;transition:border .2s,box-shadow .2s}
input[type=password]:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.2)}
input[type=password]::placeholder{color:#64748b}
button{width:100%;padding:12px;margin-top:16px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:1rem;font-weight:500;cursor:pointer;transition:background .2s}
button:hover{background:#1d4ed8}
button:active{background:#1e40af}
.err{color:#f87171;font-size:.85rem;margin-top:12px;min-height:1.2em}
.footer{margin-top:24px;font-size:.75rem;color:#64748b}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg viewBox="140 60 340 350" aria-hidden="true"><path fill="#fff" d="M469 255 427 232 383 224 334 191 288 178 267 167 237 68 199 170C170 199 153 242 159 283L151 342C159 383 183 402 209 394L264 348 310 332 348 310 369 291 469 255Z"/></svg></div>
  <h1 id="title">FlyGo</h1>
  <p class="sub" id="subtitle">输入密码以继续</p>
  <form id="login-form">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit" id="btn">登录</button>
  </form>
  <p class="err" id="err"></p>
  <p class="footer">FlyGo Private Cloud</p>
</div>
<script>
const I18N={zh:{title:'FlyGo',sub:'输入密码以继续',btn:'登录',ph:'密码',err_invalid:'密码错误',err_net:'连接失败',en_title:'FlyGo',en_sub:'Enter password to continue'},en:{title:'FlyGo',sub:'Enter password to continue',btn:'Sign in',ph:'Password',err_invalid:'Invalid password',err_net:'Connection failed',en_title:'FlyGo',en_sub:'Enter password to continue'}};
function getLang(){try{return localStorage.getItem('lang')||'zh'}catch(e){return'zh'}}
function applyI18n(){const l=getLang(),t=I18N[l]||I18N.zh;document.getElementById('title').textContent=t.title;document.getElementById('subtitle').textContent=t.sub;document.getElementById('btn').textContent=t.btn;document.getElementById('pw').placeholder=t.ph;document.title=t.title+' - Login'}
applyI18n();
(async()=>{try{const r=await fetch('/api/auth/status');const d=await r.json();if(!d.enabled)window.location.href='/'}catch(e){}})();
document.getElementById('login-form').addEventListener('submit',async(e)=>{
  e.preventDefault();const pw=document.getElementById('pw').value;const err=document.getElementById('err');err.textContent='';document.getElementById('btn').disabled=true;
  try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});if(r.ok){window.location.href='/'}else{const l=getLang(),t=I18N[l]||I18N.zh;err.textContent=t.err_invalid}}
  catch(e2){const l=getLang(),t=I18N[l]||I18N.zh;err.textContent=t.err_net}
  document.getElementById('btn').disabled=false
});
</script>
</body>
</html>
