# FlyGo webcli — Rust 单二进制版（axum + WebSocket + ConPTY）
# 静态资源（static/）由 rust-embed 在编译期内嵌进二进制，运行只需一个 exe。

[package]
name = "flygo-webcli"
version = "0.3.1"
edition = "2021"
description = "FlyGo webcli — Web command-line app backend (axum + WebSocket + ConPTY, single binary)"
publish = false

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
